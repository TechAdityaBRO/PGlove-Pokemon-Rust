[package]
name = "pglove"
version = "1.0.4"
description = "PGlove — A Browser With A New Generation"
authors = ["Aditya (TechAdityaBRO)"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true